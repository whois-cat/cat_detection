# streamhub, cv-worker, decider, pruner (see README.md, PLAN.md); settings in
# config.yaml (from config.example.yaml), secrets in secrets/streamhub.env.
# Uses its own data dirs (data/streamhub, data/decider) and port, and each camera's second
# RTSP session slot, so it can run next to the previous stack.
#
#   just up | down | ps | logs [service] | status

services:
  streamhub:
    build:
      context: .
      dockerfile: streamhub/Dockerfile
    restart: unless-stopped
    # Recordings are owned by the invoking user, not root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${STREAMHUB_BIND:-127.0.0.1}:${STREAMHUB_PORT:-8096}:8090"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data/streamhub:/data
    # Values for ${VAR} references in config.yaml (e.g. RTSP credentials).
    env_file:
      - path: ./secrets/streamhub.env
        required: false

  # CV for all cameras. More workers (e.g. on a GPU machine) can connect to the
  # hub port too; it isn't published by default since it carries raw video.
  cv-worker:
    build:
      context: .
      dockerfile: cv-worker/Dockerfile
    restart: unless-stopped
    depends_on: [streamhub]
    environment:
      STREAMHUB_HUB: streamhub:9000
      # Shown in the web UI and logs (default would be the container id).
      CV_WORKER_ID: local
      CV_MODEL: yolo_cat
      # Inferences per second per camera at most; caps CPU use (0 = unlimited).
      CV_MAX_FPS: "2"
      CLASSIFIER_DIR: /opt/models/classifier/current
      # Must match the crop padding the classifier was trained with.
      CLASSIFIER_PAD_FRAC: "0.05"
    volumes:
      # Mount the parent dir (not the `current` symlink) so a promoted version
      # switch is visible on restart.
      - ./models/classifier:/opt/models/classifier:ro

  # Sparsifies old recordings and enforces the size cap (config.yaml: pruner).
  pruner:
    build:
      context: .
      dockerfile: streamhub/Dockerfile
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["pruner"]
    command: ["-config", "/config.yaml"]
    healthcheck:
      disable: true
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data/streamhub:/data
    # config.yaml is shared, so its ${VAR} references must resolve here too.
    env_file:
      - path: ./secrets/streamhub.env
        required: false

  # Feeding decisions: drives the feeders (config.yaml: decider).
  decider:
    build:
      context: .
      dockerfile: decider/Dockerfile
    restart: unless-stopped
    depends_on: [streamhub]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      STREAMHUB_HUB: streamhub:9000
      DECIDER_ID: decider
      # 1 forces a dry run (never calls the feeder API), whatever config.yaml says.
      DECIDER_DRY_RUN: ${DECIDER_DRY_RUN:-}
      # Scheduled feeding times are local to feed.tz; logs use this.
      TZ: ${TZ:-UTC}
    volumes:
      - ./config.yaml:/config.yaml:ro
      # Its own state (feed journal), separate from recordings.
      - ./data/decider:/data
    env_file:
      - path: ./secrets/streamhub.env
        required: false

  # MLflow experiment-tracking UI over the local file store the training
  # scripts write to (./data/mlflow). Training runs on the host.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    restart: unless-stopped
    ports:
      - "${MLFLOW_BIND:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./data/mlflow:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri file:/mlflow
      --artifacts-destination file:/mlflow/artifacts
      --serve-artifacts
