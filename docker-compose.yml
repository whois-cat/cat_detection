# Base stack. Multi-camera detector services live in
# docker-compose.cameras.yml (generated by tools/configure.py from
# cameras.yaml). ALWAYS layer the cameras file in:
#
#   docker compose -f docker-compose.yml -f docker-compose.cameras.yml up -d
#
# `just devserver` / `just almostprod` set the -f flags for you.

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    # Host networking is required for WebRTC ICE on LAN — the browser connects
    # directly to webrtcAdditionalHosts:webrtcAddress for media. Detector
    # containers (on the default bridge) reach mediamtx via
    # host.docker.internal:8554, not the docker network.
    network_mode: host
    volumes:
      # Generated by tools/configure.py from cameras.yaml.
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/recordings
    # Camera RTSP sources (with credentials) are injected here as
    # MTX_PATHS_<ID>_SOURCE — generated into the gitignored secrets/cameras.env
    # by `just configure`. required:false so the stack still parses before the
    # first configure run; mediamtx then has no source until you configure.
    env_file:
      - path: ./secrets/cameras.env
        required: false
    environment:
      TZ: ${RECORDING_TZ:-UTC}
      MTX_LOGLEVEL: info

  pruner:
    build: ./pruner
    restart: unless-stopped
    depends_on: [mediamtx]
    volumes:
      - ./data/recordings:/recordings
      - ./data/events:/data/events:ro
    environment:
      EVENTS_DB: /data/events/events.db
      RECORDING_TZ: ${RECORDING_TZ:-UTC}
      SEGMENT_DURATION_SEC: "30"        # must match mediamtx recordSegmentDuration
      KEEP_PRE_ROLL_SEC: ${PRUNER_PRE_ROLL_SEC:-30}
      KEEP_POST_ROLL_SEC: ${PRUNER_POST_ROLL_SEC:-30}
      KEEP_RECENT_HOURS: ${PRUNER_KEEP_RECENT_HOURS:-24}
      PRUNE_INTERVAL_SEC: ${PRUNER_INTERVAL_SEC:-3600}
      DRY_RUN: ${PRUNER_DRY_RUN:-0}

  # Live recording indexer: keeps recording_segments in sync with the mp4 files
  # mediamtx writes, so the WebUI timeline grows automatically without a manual
  # `just recordings-index-rebuild`. Single writer of recording_segments; the
  # detector only reads it. Build context is the repo root so it can reuse
  # detector/recordings_index.py (the index logic's single source of truth).
  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    restart: unless-stopped
    depends_on: [mediamtx]
    volumes:
      # Mount at the same relative path the CLI rebuild uses (repo-root-relative
      # `data/recordings`). WORKDIR is /app, so segment paths are stored as
      # `data/recordings/<camera>/<file>.mp4`, matching
      # `just recordings-index-rebuild`. The path column is UNIQUE, so a
      # mismatch here would duplicate every row across the two writers.
      - ./data/recordings:/app/data/recordings:ro
      - ./data/events:/data/events
    environment:
      RECORDINGS_DIR: data/recordings
      EVENTS_DB: /data/events/events.db
      RECORDING_TZ: ${RECORDING_TZ:-UTC}
      SEGMENT_DURATION_SEC: "30"        # must match mediamtx recordSegmentDuration
      INDEX_INTERVAL_SEC: ${INDEXER_INTERVAL_SEC:-30}
      INDEX_WINDOW_SEC: ${INDEXER_WINDOW_SEC:-900}
      RECONCILE_INTERVAL_SEC: ${INDEXER_RECONCILE_SEC:-300}
      STARTUP_LOOKBACK_SEC: ${INDEXER_STARTUP_LOOKBACK_SEC:-86400}
      MIN_STABLE_AGE_SEC: ${INDEXER_MIN_STABLE_AGE_SEC:-10}
      # Explicit camera allow-list (csv). Keeps the deleted typo camera
      # "beidge" from ever being re-indexed. Override via env if cameras change.
      RECORDINGS_CAMERAS: ${RECORDINGS_CAMERAS:-beige,grey}

  # MLflow experiment-tracking UI over the local file store that the training
  # scripts write to (./data/mlflow). Training itself runs on the host and logs
  # straight to that dir by default; this service is just the browser UI. To
  # route training THROUGH the server (so artifacts resolve in the web UI too),
  # run training with MLFLOW_TRACKING_URI=http://localhost:${MLFLOW_PORT:-5000}.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./data/mlflow:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri file:/mlflow
      --artifacts-destination file:/mlflow/artifacts
      --serve-artifacts

  webui:
    build: ./webui
    restart: unless-stopped
    depends_on: [mediamtx]
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./data/events:/usr/share/nginx/html/events:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
