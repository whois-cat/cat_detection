services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    # Host networking is required for WebRTC ICE on LAN — the browser connects
    # directly to webrtcAdditionalHosts:webrtcAddress for media.
    network_mode: host
    volumes:
      - ./mediamtx/mediamtx.yml.tpl:/mediamtx.yml.tpl:ro
      - ./mediamtx/entrypoint.sh:/entrypoint.sh:ro
      - ./data/recordings:/recordings
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      MTX_LOGLEVEL: info
      # All three are substituted into the YAML template by entrypoint.sh.
      # CAMERA_ID is the SAME string the detector tags events with —
      # recordings land under /recordings/<CAMERA_ID>/.
      CAMERA_ID:   ${CAMERA_ID:-default}
      RTSP_URL:    ${RTSP_URL}
      WEBRTC_HOST: ${WEBRTC_HOST}

  detector:
    build: ./detector
    restart: unless-stopped
    depends_on: [mediamtx]
    network_mode: host    # share localhost with mediamtx for RTSP pull
    environment:
      # mediamtx and the detector use the SAME path name. mediamtx republishes
      # the camera at rtsp://localhost:8554/<CAMERA_ID>; the detector pulls
      # from there and tags every event with the same string.
      CAMERA_ID:   ${CAMERA_ID:-default}
      RTSP_SOURCE: rtsp://127.0.0.1:8554/${CAMERA_ID:-default}
      DETECTOR_TYPE: ${DETECTOR_TYPE:-blob}      # 'blob' or 'yolo'
      BLOB_BRIGHT_THRESHOLD: ${BLOB_BRIGHT_THRESHOLD:-240}
      BLOB_MIN_AREA: ${BLOB_MIN_AREA:-500}
      YOLO_WEIGHTS: ${YOLO_WEIGHTS:-/opt/models/yolov8n_int8_openvino_model/}
      YOLO_CONF: ${YOLO_CONF:-0.25}
      DETECT_ROI:  ${DETECT_ROI:-0,0,1,1}
      ACTION_POLYGON: ${ACTION_POLYGON:-0,0,1,1}
      FRAME_ROTATE_DEG: ${FRAME_ROTATE_DEG:-0}
      EVENTS_DB: /data/events/events.db
      WS_PORT: "8091"
      CONTROL_PORT: "8092"
      ARTIFICIAL_DELAY_MS: ${ARTIFICIAL_DELAY_MS:-0}
    volumes:
      - ./data/events:/data/events

  pruner:
    build: ./pruner
    restart: unless-stopped
    depends_on: [mediamtx, detector]
    volumes:
      - ./data/recordings:/recordings
      - ./data/events:/data/events:ro
    environment:
      EVENTS_DB: /data/events/events.db
      SEGMENT_DURATION_SEC: "30"        # must match mediamtx recordSegmentDuration
      KEEP_PRE_ROLL_SEC: ${PRUNER_PRE_ROLL_SEC:-30}
      KEEP_POST_ROLL_SEC: ${PRUNER_POST_ROLL_SEC:-30}
      KEEP_RECENT_HOURS: ${PRUNER_KEEP_RECENT_HOURS:-24}
      PRUNE_INTERVAL_SEC: ${PRUNER_INTERVAL_SEC:-3600}
      DRY_RUN: ${PRUNER_DRY_RUN:-0}

  webui:
    build: ./webui
    restart: unless-stopped
    depends_on: [detector, mediamtx]
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./data/events:/usr/share/nginx/html/events:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
