# GENERATED by tools/configure.py from cameras.yaml — do not edit.
upstream detector_camera      { server detector-camera:8091; }
upstream detector_camera_ctl  { server detector-camera:8092; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Per-camera detector REST + WS + control endpoints.
    location /detector/camera/ {
        proxy_pass http://detector_camera/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location /detector-control/camera/ {
        proxy_pass http://detector_camera_ctl/;
        proxy_http_version 1.1;
    }

    # mediamtx (single instance, multiple paths) — path is part of the query string.
    location /whep/ {
        proxy_pass http://host.docker.internal:8889/;
        proxy_http_version 1.1;
    }
    location /recordings/ {
        proxy_pass http://host.docker.internal:9996/;
        proxy_http_version 1.1;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
