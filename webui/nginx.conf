server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA — no caching during dev so updates show immediately
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Detector REST + WS proxy
    location /detector/ {
        proxy_pass http://host.docker.internal:8091/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Detector control endpoints (artificial delay, etc.) — separate port
    location /detector-control/ {
        proxy_pass http://host.docker.internal:8092/;
        proxy_http_version 1.1;
    }

    # mediamtx WebRTC signalling (WHEP).
    # Browser POSTs SDP offer to /whep/camera/whep, gets SDP answer back.
    location /whep/ {
        proxy_pass http://host.docker.internal:8889/;
        proxy_http_version 1.1;
    }

    # mediamtx recording playback (history).
    #   /recordings/list?path=camera                 — JSON of available ranges
    #   /recordings/get?path=camera&start=...&...    — HLS playlist for a range
    location /recordings/ {
        proxy_pass http://host.docker.internal:9996/;
        proxy_http_version 1.1;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
