[project]
name = "decider"
version = "0.1.0"
description = "Feeding decisions from streamhub's CV results; drives the feeders."
requires-python = ">=3.11"
dependencies = ["hubclient", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
decider = "decider.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decider"]

[tool.uv.sources]
hubclient = { path = "../hubclient", editable = true }
