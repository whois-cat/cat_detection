# Dev overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Overrides:
#   - webui:    vite dev server with HMR, source mounted live
#   - detector: watchfiles wraps `python main.py`, source mounted live
# Other services (mediamtx) keep their production behaviour.

services:
  webui:
    # Drop the production Dockerfile build entirely. Use node image directly.
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    volumes:
      - ./webui:/app
      - webui_node_modules:/app/node_modules     # named volume; faster than bind, isolates Linux/host modules
    environment:
      UPSTREAM_HOST: host.docker.internal
    command: sh -c "npm install --silent && npm run dev"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `!override` replaces the base list instead of appending — otherwise we'd
    # also inherit the 8090:80 mapping from production and Docker would try to
    # bind host port 8090 twice → "port already allocated" with nothing actually
    # listening on it (libnetwork sees the conflict during the second bind).
    ports: !override
      - "${WEB_PORT:-8090}:5173"

  detector:
    # Re-use the existing detector image (with PyAV/cv2/av libs and watchfiles
    # added via requirements.txt). Mount source so edits trigger reload.
    volumes:
      - ./detector:/app
      - ./data/events:/data/events
    command: ["python", "-u", "-m", "watchfiles", "--filter", "python", "python -u main.py", "/app"]

volumes:
  webui_node_modules:
