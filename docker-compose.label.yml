# Optional, standalone Label Studio for YOLO box review. NOT part of the main
# stack (streaming/recording/feeders are untouched). Start with `just yolo-label`.
# Bound to localhost only, like the rest of the stack; reach it over SSH tunnel:
#   ssh -L 8080:localhost:8080 <server>
services:
  label-studio:
    image: heartexlabs/label-studio:1.12.0
    container_name: cat_label_studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      # Serve the collected frames straight from the catalog folder (no copies).
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
      # First-boot admin so you can log in and copy an access token.
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-admin@example.com}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-change-me-12345}
    volumes:
      - label_studio_data:/label-studio/data
      - ./data/yolo_dataset:/label-studio/files:ro

volumes:
  label_studio_data:
