<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cat cluster review</title>
<style>
  :root { --bg:#11131a; --panel:#171a23; --fg:#e6e8ee; --muted:#8b90a0;
          --line:#2a2f3d; --accent:#4f8cff; --ok:#36c5a0; --warn:#ffbd4a; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-rows:auto 1fr;
         background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:15px; }
  .hint { color:var(--muted); }
  .grow { flex:1; }
  #bar { width:260px; height:4px; overflow:hidden; border-radius:3px; background:#262a36; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); }
  main { min-height:0; display:grid; grid-template-columns:280px 1fr 340px; }
  nav, aside { min-height:0; overflow:auto; background:var(--panel); }
  nav { border-right:1px solid var(--line); padding:10px; }
  aside { border-left:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:12px; }
  .cluster { width:100%; display:flex; justify-content:space-between; gap:8px; padding:8px 10px;
             background:#1b1f2a; color:var(--fg); border:1px solid var(--line);
             border-radius:6px; cursor:pointer; margin-bottom:6px; text-align:left; }
  .cluster:hover, .cluster.active { border-color:var(--accent); }
  .cluster.done { opacity:.65; }
  .cluster.child { margin-left:18px; width:calc(100% - 18px); }
  .cluster .status { color:var(--muted); font-size:12px; }
  #stage { min-width:0; min-height:0; padding:16px; overflow:auto; }
  #grid { min-height:100%; display:grid; grid-template-columns:repeat(auto-fill, minmax(132px, 1fr));
          align-content:start; gap:10px; }
  .crop { min-width:0; display:flex; flex-direction:column; gap:4px; padding:6px;
          border-radius:6px; background:#08090d; border:1px solid #111521; }
  .crop img { width:100%; aspect-ratio:1/1; object-fit:contain; display:block; border-radius:4px; background:#08090d; }
  .crop small { color:var(--muted); font:11px/1.2 ui-monospace, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #grid.loading { opacity:.35; }
  .mode { display:flex; gap:8px; }
  button { background:#1d2230; color:var(--fg); border:1px solid var(--line); border-radius:7px;
           padding:9px 11px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  .labels { display:flex; flex-direction:column; gap:8px; margin-top:auto; }
  .label { display:flex; align-items:center; gap:10px; text-align:left; font-weight:600; }
  .label .k { width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center;
              border-radius:5px; background:#30364a; color:#cbd3e5; font-size:12px; }
  .mixed { border-color:var(--warn); }
  .discard { color:var(--muted); }
  .meta { display:grid; gap:4px; color:var(--muted); }
  .counts { display:flex; gap:10px; flex-wrap:wrap; }
  .counts b { color:var(--fg); font-weight:600; }
  .counts .c0 { color:var(--muted); }
  .crop { cursor:pointer; }
  .crop.selected { outline:2px solid var(--accent); outline-offset:1px; }
  .crop.hiddenDup { opacity:.72; }
  .badges { display:flex; flex-wrap:wrap; gap:3px; min-height:16px; }
  .badge { display:inline-flex; max-width:100%; padding:1px 5px; border-radius:4px;
           background:#20283a; color:#aeb8d0; font:10px/1.4 ui-monospace, monospace; }
  .badge.warn { color:#ffd88a; background:#3a2b16; }
  #cropbar { display:none; align-items:center; gap:8px; flex-wrap:wrap;
             padding:8px 10px; margin-bottom:10px; border:1px solid var(--accent);
             border-radius:7px; background:#16243a; }
  #cropbar.show { display:flex; }
  #cropbar .pill { color:var(--muted); }
  #cropbar button { padding:6px 9px; }
  .bulk { border-top:1px solid var(--line); border-bottom:1px solid var(--line);
          padding:12px 0; display:grid; gap:8px; }
  .bulk .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  select { background:#1d2230; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:8px; font:inherit; }
  button.primary { background:#243b67; border-color:#3f73d9; }
  button.activeMode { border-color:var(--accent); color:#dbe7ff; }
</style>
</head>
<body>
<header>
  <h1>cat cluster review</h1>
  <span id="title" class="hint"></span>
  <div class="grow"></div>
  <div id="bar"><i></i></div>
  <span id="progress" class="hint">0 / 0</span>
  <span id="counts" class="hint counts"></span>
</header>
<main>
  <nav id="clusters"></nav>
  <section id="stage">
    <div id="cropbar">
      <span class="pill"><b id="selCount">0</b> selected · label as:</span>
      <span id="cropLabels"></span>
      <button onclick="clearSelection()">clear</button>
    </div>
    <div id="grid"></div>
  </section>
  <aside>
    <div class="meta">
      <b id="clusterName">cluster</b>
      <span id="clusterMeta"></span>
      <span id="clusterStatus"></span>
    </div>
	    <div class="mode">
	      <button onclick="setMode('representative')">representative</button>
	      <button onclick="setMode('random')">random</button>
	      <button onclick="setMode('outliers')">outliers</button>
	      <button onclick="setMode('suspicious')">suspicious first</button>
	    </div>
	    <div class="mode">
	      <button id="dupToggle" onclick="toggleDuplicates()">show duplicates</button>
	    </div>
	    <div class="bulk">
	      <b>majority with exceptions</b>
	      <div class="row">
	        <span class="hint">selected →</span>
	        <select id="exceptionLabel"></select>
	        <span class="hint">rest →</span>
	        <select id="majorityLabel"></select>
	      </div>
	      <button class="primary" onclick="labelWithExceptions()">apply selected/rest</button>
	      <div id="quickBulk" class="row"></div>
	    </div>
	    <div class="mode">
	      <button onclick="splitCluster(2)">split x2</button>
	      <button onclick="splitCluster(3)">split x3</button>
	    </div>
	    <div class="labels" id="buttons"></div>
	    <div class="hint">keys: click select · shift-click range · a all loaded · i invert · esc clear · 1..N label · x split · m mixed · s skip · ←/→ cluster</div>
  </aside>
</main>
<script>
let M = null;
let idx = 0;
let mode = 'representative';
let ACTIONS = [];
let renderSeq = 0;
let selected = new Set();   // per-crop selection (crop_ids) within current cluster
let currentItems = [];
let lastClickedIndex = null;
let showDuplicates = false;

async function load() {
  M = await (await fetch('/api/clusters')).json();
  ACTIONS = [...M.labels, ...M.extra_labels, 'mixed', 'skip'];
  idx = Math.max(0, M.queue.findIndex(c => !c.status));
  if (idx < 0) idx = 0;
  renderButtons();
  renderCropLabels();
  renderBulkControls();
  render();
  loadCounts();
}

async function loadCounts() {
  try {
    const data = await (await fetch('/api/counts?t=' + Date.now())).json();
    const el = document.getElementById('counts');
    el.innerHTML = '';
    const order = data.order && data.order.length
        ? data.order : Object.keys(data.counts);
    order.forEach(lab => {
      const n = data.counts[lab] || 0;
      const span = document.createElement('span');
      span.className = n ? '' : 'c0';
      span.innerHTML = `${lab} <b>${n}</b>`;
      el.appendChild(span);
    });
  } catch (e) { /* counts are best-effort */ }
}

function curr() { return M.queue[idx]; }

function renderButtons() {
  const wrap = document.getElementById('buttons');
  wrap.innerHTML = '';
  ACTIONS.forEach((lab, i) => {
    const b = document.createElement('button');
    b.className = 'label' + (lab === 'discard' || lab === 'skip' ? ' discard' : '')
                         + (lab === 'mixed' ? ' mixed' : '');
    b.innerHTML = `<span class="k">${i + 1}</span><span>${lab}</span>`;
    b.onclick = () => choose(lab);
    wrap.appendChild(b);
  });
}

function renderBulkControls() {
  const exception = document.getElementById('exceptionLabel');
  const majority = document.getElementById('majorityLabel');
  exception.innerHTML = '';
  majority.innerHTML = '';
  [...M.labels, ...M.extra_labels].forEach(lab => {
    const o = document.createElement('option');
    o.value = lab;
    o.textContent = lab;
    exception.appendChild(o);
  });
  M.labels.forEach(lab => {
    const o = document.createElement('option');
    o.value = lab;
    o.textContent = lab;
    majority.appendChild(o);
  });
  if ([...M.extra_labels].includes('discard')) exception.value = 'discard';
  if (M.labels.length) majority.value = M.labels[0];

  const quick = document.getElementById('quickBulk');
  quick.innerHTML = '';
  ['discard', 'unknown'].filter(l => M.extra_labels.includes(l)).forEach(exc => {
    M.labels.forEach(cat => {
      const b = document.createElement('button');
      b.textContent = `${exc} / ${cat}`;
      b.onclick = () => labelWithExceptions(exc, cat);
      quick.appendChild(b);
    });
  });
}

function renderList() {
  const nav = document.getElementById('clusters');
  nav.innerHTML = '';
  M.queue.forEach((c, i) => {
    const b = document.createElement('button');
	    b.className = 'cluster' + (i === idx ? ' active' : '') + (c.status ? ' done' : '')
	                         + (c.split_child ? ' child' : '');
	    const status = c.status ? `${c.status.label || c.status.status}` : 'open';
	    const name = c.parent_id == null ? `#${c.cluster_id}` : `#${c.parent_id} → #${c.cluster_id}`;
	    b.innerHTML = `<span>${name} · ${c.size}</span><span class="status">${status}</span>`;
    b.onclick = () => { idx = i; render(); };
    nav.appendChild(b);
  });
}

let currentClusterId = null;
function render() {
  const c = curr();
  if (c.cluster_id !== currentClusterId) { selected.clear(); currentClusterId = c.cluster_id; }
  currentItems = [];
  lastClickedIndex = null;
  renderCropbar();
  renderList();
  document.getElementById('progress').textContent =
      `${M.done_clusters} / ${M.total_clusters} clusters · ${M.reviewed_items} crops`;
  document.getElementById('bar').firstElementChild.style.width =
      (100 * M.done_clusters / Math.max(1, M.total_clusters)) + '%';
  document.getElementById('title').textContent =
      `detector min_score ${M.params.min_score ?? 'n/a'}`;
	  document.getElementById('clusterName').textContent = `cluster #${c.cluster_id}`;
	  document.getElementById('clusterMeta').textContent =
	      `${c.size} crops · ${c.visible_count ?? c.size} shown`
	      + (c.hidden_duplicate_count ? ` · ${c.hidden_duplicate_count} near-duplicates hidden` : '')
	      + (c.hidden_count && c.hidden_count !== c.hidden_duplicate_count ? ` · ${c.hidden_count} total hidden` : '')
	      + ` · ${c.reviewed_items} labelled`
	      + (c.parent_id == null ? '' : ` · split from #${c.parent_id}`);
  document.getElementById('clusterStatus').textContent =
      c.status ? `status: ${c.status.status} ${c.status.label || ''}` : 'status: open';
  document.getElementById('dupToggle').textContent = showDuplicates ? 'hide duplicates' : 'show duplicates';
  renderGrid(c);
}

function setMode(next) { mode = next; render(); }

function toggleDuplicates() {
  showDuplicates = !showDuplicates;
  render();
}

async function renderGrid(c) {
  const seq = ++renderSeq;
  document.getElementById('stage').scrollTop = 0;
  const grid = document.getElementById('grid');
  grid.classList.add('loading');
  grid.innerHTML = '';
  const r = await fetch(`/api/cluster/${c.cluster_id}/items?mode=${mode}&show_duplicates=${showDuplicates ? 'true' : 'false'}&t=${Date.now()}`);
  if (seq !== renderSeq) return;
  if (!r.ok) {
    grid.innerHTML = '<div class="hint">failed to load cluster items</div>';
    grid.classList.remove('loading');
    return;
  }
  const data = await r.json();
  if (seq !== renderSeq) return;
  currentItems = data.items;
  const frag = document.createDocumentFragment();
  data.items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'crop' + (selected.has(item.crop_id) ? ' selected' : '')
                            + (item.is_duplicate ? ' hiddenDup' : '');
    card.dataset.cropId = item.crop_id;
    card.dataset.index = String(i);
    card.onclick = (ev) => toggleSelect(item.crop_id, card, ev.shiftKey, i);
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = item.crop_id;
    img.src = `/api/crop/${encodeURIComponent(item.crop_id)}?thumb=160`;
    const meta = document.createElement('small');
    const score = item.score == null ? '' : ` · ${(item.score * 100).toFixed(0)}%`;
    meta.textContent = `${i + 1}/${data.items.length} · ${item.camera}${score}${item.label ? ` · ${item.label}` : ''}`;
    const badges = document.createElement('div');
    badges.className = 'badges';
    if (item.is_duplicate) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'duplicate';
      badges.appendChild(b);
    }
    (item.suspicious_reasons || []).forEach(reason => {
      const b = document.createElement('span');
      b.className = 'badge warn';
      b.textContent = reason;
      badges.appendChild(b);
    });
    card.appendChild(img);
    card.appendChild(meta);
    card.appendChild(badges);
    frag.appendChild(card);
  });
  if (data.hidden_duplicate_count && !showDuplicates) {
    const note = document.createElement('div');
    note.className = 'hint';
    note.textContent = `${data.total} crops, ${data.shown_count} shown, ${data.hidden_duplicate_count} near-duplicates hidden`;
    frag.appendChild(note);
  }
  grid.appendChild(frag);
  grid.classList.remove('loading');
}

function renderCropLabels() {
  const wrap = document.getElementById('cropLabels');
  if (!wrap || !M) return;
  wrap.innerHTML = '';
  [...M.labels, ...M.extra_labels].forEach(lab => {
    const b = document.createElement('button');
    b.textContent = lab;
    b.onclick = () => labelSelected(lab);
    wrap.appendChild(b);
  });
}

function setCardSelected(cropId, on) {
  if (on) selected.add(cropId);
  else selected.delete(cropId);
  const el = document.querySelector(`.crop[data-crop-id="${CSS.escape(cropId)}"]`);
  if (el) el.classList.toggle('selected', on);
}

function toggleSelect(cropId, card, range, index) {
  if (range && lastClickedIndex != null && currentItems.length) {
    const [a, b] = [lastClickedIndex, index].sort((x, y) => x - y);
    for (let n = a; n <= b; n++) setCardSelected(currentItems[n].crop_id, true);
  } else {
    setCardSelected(cropId, !selected.has(cropId));
  }
  lastClickedIndex = index;
  renderCropbar();
}

function clearSelection() {
  selected.clear();
  document.querySelectorAll('.crop.selected').forEach(el => el.classList.remove('selected'));
  renderCropbar();
}

function selectAllLoaded() {
  currentItems.forEach(item => selected.add(item.crop_id));
  document.querySelectorAll('.crop').forEach(el => el.classList.add('selected'));
  renderCropbar();
}

function invertSelection() {
  currentItems.forEach(item => {
    if (selected.has(item.crop_id)) selected.delete(item.crop_id);
    else selected.add(item.crop_id);
  });
  document.querySelectorAll('.crop').forEach(el => {
    el.classList.toggle('selected', selected.has(el.dataset.cropId));
  });
  renderCropbar();
}

function renderCropbar() {
  document.getElementById('selCount').textContent = selected.size;
  document.getElementById('cropbar').classList.toggle('show', selected.size > 0);
}

async function labelSelected(label) {
  if (!selected.size) return;
  const crop_ids = [...selected];
  const r = await fetch('/api/crop_label', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({crop_ids, label})
  });
  if (!r.ok) { alert('per-crop label failed: ' + await r.text()); return; }
  clearSelection();
  await load();
}

async function labelWithExceptions(exceptionLabel, majorityLabel) {
  if (!selected.size) {
    alert('select one or more exception crops first');
    return;
  }
  const c = curr();
  const exc = exceptionLabel || document.getElementById('exceptionLabel').value;
  const maj = majorityLabel || document.getElementById('majorityLabel').value;
  const selectedCount = selected.size;
  const rest = Math.max(0, c.size - selectedCount);
  const ok = confirm(`Label ${selectedCount} selected crop(s) as ${exc} and ${rest} remaining crop(s) as ${maj}?`);
  if (!ok) return;
  const r = await fetch('/api/cluster_label_with_exceptions', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      cluster_id:c.cluster_id,
      majority_label:maj,
      exceptions:{[exc]: [...selected]},
    })
  });
  if (!r.ok) { alert('bulk label failed: ' + await r.text()); return; }
  clearSelection();
  await load();
}

	async function choose(label) {
  const c = curr();
  const r = await fetch('/api/cluster_review', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cluster_id:c.cluster_id, label})
  });
  if (!r.ok) { alert('save failed'); return; }
	  await load();
	}

	async function splitCluster(parts) {
	  const c = curr();
	  const r = await fetch('/api/cluster_split', {
	    method:'POST', headers:{'Content-Type':'application/json'},
	    body:JSON.stringify({cluster_id:c.cluster_id, parts})
	  });
	  if (!r.ok) {
	    const msg = await r.text();
	    alert(`split failed: ${msg}`);
	    return;
	  }
	  await load();
	}

function go(d) {
  idx = Math.max(0, Math.min(M.queue.length - 1, idx + d));
  render();
}

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'select' || tag === 'input' || tag === 'textarea') return;
	  if (e.key === 'ArrowRight') return go(1);
	  if (e.key === 'ArrowLeft') return go(-1);
	  if (e.key === 'Escape') return clearSelection();
  if (e.key === 'a') { e.preventDefault(); return selectAllLoaded(); }
  if (e.key === 'i') { e.preventDefault(); return invertSelection(); }
	  if (e.key === 'x') return splitCluster(2);
	  if (e.key === 'm') return choose('mixed');
  if (e.key === 's') return choose('skip');
  const n = parseInt(e.key, 10);
  if (Number.isNaN(n)) return;
  // With a per-crop selection active, number keys label the SELECTION (fallback
  // for mixed clusters); otherwise they label the whole cluster.
  if (selected.size > 0) {
    const labelOnly = [...M.labels, ...M.extra_labels];
    if (n >= 1 && n <= labelOnly.length) labelSelected(labelOnly[n - 1]);
    return;
  }
  if (n >= 1 && n <= ACTIONS.length) choose(ACTIONS[n - 1]);
});

load();
</script>
</body>
</html>
