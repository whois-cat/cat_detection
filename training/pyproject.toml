[project]
name = "live2-training"
version = "0.1.0"
description = "Training-data extraction + boilerplate for live2 detection pipeline."
requires-python = ">=3.10"
dependencies = [
    "av",
    "numpy",
    "opencv-python-headless",
]

# Optional extras the modeller will add when they actually train a model.
# Kept out of the base set so the extraction step alone is fast to install.
[project.optional-dependencies]
yolo       = ["ultralytics"]
# train_classifier.py needs only torch + torchvision. On Linux, uv is configured
# below to resolve both from PyTorch's CPU-only wheel index so it does not pull
# nvidia-* CUDA runtime wheels on machines without a GPU.
classifier = ["torch", "torchvision", "scikit-learn"]
# Stage B label-review web app (see ../review/requirements.txt). Decode-only —
# deliberately no openvino/torch; av+numpy come from the base deps above.
review     = ["fastapi", "uvicorn", "Pillow"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
