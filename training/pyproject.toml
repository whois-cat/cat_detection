[project]
name = "live2-training"
version = "0.1.0"
description = "Training-data extraction + boilerplate for live2 detection pipeline."
# Cap below 3.13: the pinned torch 2.5.1 only ships cp310–cp312 wheels, and the
# project's runtime venv is 3.10. Without the cap uv picks the newest managed
# Python (3.13) and the torch install fails for lack of a cp313 wheel.
requires-python = ">=3.10,<3.13"
dependencies = [
    "av",
    "numpy",
    "opencv-python-headless",
    # streamhub_dataset / yolo_common read config.yaml for per-camera geometry.
    "pyyaml",
]

# Optional extras the modeller will add when they actually train a model.
# Kept out of the base set so the extraction step alone is fast to install.
[project.optional-dependencies]
# psutil lets the YOLO run report measure job-vs-system CPU/RAM honestly;
# yolo_common degrades gracefully to self peak RSS when it is absent.
yolo       = ["ultralytics", "psutil"]
# train_classifier.py needs only torch + torchvision (from `cpu` or `gpu`, below).
classifier = ["scikit-learn", "mlflow>=2.14"]
# Which torch build: exactly one of these, chosen by the justfile from
# TRAINING_TORCH (default cpu; `gpu` on the NVIDIA training box). On Linux `cpu`
# comes from PyTorch's CPU-only index, so machines without a GPU do not pull the
# nvidia-* CUDA runtime wheels; `gpu` comes from the CUDA 12.4 index. On macOS
# both resolve to the PyPI wheels.
#
# Pin a KNOWN-GOOD compatible pair. Without a pin, uv grabs the latest torch;
# during a release window the matching torchvision macOS/arm64 wheel may not be
# on PyPI yet and the install fails. torch 2.5.1 / torchvision 0.20.1 ship
# macOS-arm64 (PyPI), Linux CPU-index and Linux CUDA-index wheels.
cpu = ["torch==2.5.1", "torchvision==0.20.1"]
gpu = ["torch==2.5.1", "torchvision==0.20.1"]
# Drive Label Studio for box + cat-name review (push frames, pull labels). The legacy
# SDK Client API is what training.yolo_label_studio uses.
label      = ["label-studio-sdk<1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "platform_system == 'Linux'" },
    { index = "pytorch-cu124", extra = "gpu", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "platform_system == 'Linux'" },
    { index = "pytorch-cu124", extra = "gpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
