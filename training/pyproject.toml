[project]
name = "live2-training"
version = "0.1.0"
description = "Training-data extraction + boilerplate for live2 detection pipeline."
# Cap below 3.13: the pinned torch 2.5.1 only ships cp310–cp312 wheels, and the
# project's runtime venv is 3.10. Without the cap uv picks the newest managed
# Python (3.13) and the torch install fails for lack of a cp313 wheel.
requires-python = ">=3.10,<3.13"
dependencies = [
    "av",
    "numpy",
    "opencv-python-headless",
]

# Optional extras the modeller will add when they actually train a model.
# Kept out of the base set so the extraction step alone is fast to install.
[project.optional-dependencies]
yolo       = ["ultralytics"]
# train_classifier.py needs only torch + torchvision. On Linux, uv is configured
# below to resolve both from PyTorch's CPU-only wheel index so it does not pull
# nvidia-* CUDA runtime wheels on machines without a GPU.
#
# Pin a KNOWN-GOOD compatible pair (matches the project's main .venv). Without a
# pin, uv grabs the latest torch; during a release window the matching
# torchvision macOS/arm64 wheel may not be on PyPI yet, so uv falls back to the
# Linux-only CPU-index build (e.g. torchvision==X+<hash>) which has no macOS
# wheel and the install fails. torch 2.5.1 / torchvision 0.20.1 ship both
# macOS-arm64 (PyPI) and Linux CPU-index wheels.
classifier = ["torch==2.5.1", "torchvision==0.20.1", "scikit-learn", "mlflow>=2.14"]
# Stage B label-review web app (see ../review/requirements.txt). Decode-only —
# deliberately no openvino/torch; av+numpy come from the base deps above.
review     = ["fastapi", "uvicorn", "Pillow"]
# Optional Stage A DINOv2 embedding backend (`--embedding dinov2`) for cleaner
# cold-start clusters. OFFLINE labeling only — never used by live inference, the
# detector, or the feeder. Everything else (time mode, efficientnet, visual)
# works without this extra. torch pin matches `classifier` above; on Linux uv
# resolves it from the CPU wheel index configured below.
label      = ["torch==2.5.1", "transformers>=4.40", "Pillow"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
