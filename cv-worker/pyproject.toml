[project]
name = "cv-worker"
version = "0.1.0"
description = "Stateless CV worker: compressed frames from streamhub in, detections out."
# Model stack pinned to the versions the previous detector ran with.
requires-python = ">=3.11,<3.13"
dependencies = [
    "hubclient",
    "av>=14",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
yolo = [
    "ultralytics==8.3.18",
    "openvino==2024.4.0",
    "pillow>=10",
    "torch==2.5.1",
    "torchvision==0.20.1",
]
# Only needed to export YOLO to INT8 OpenVINO (image build).
export = ["nncf==2.13.0"]

[project.scripts]
cv-worker = "cv_worker.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_worker"]

[tool.uv.sources]
hubclient = { path = "../hubclient", editable = true }
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
