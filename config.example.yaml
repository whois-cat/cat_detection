# Shared config for the new stack (see PLAN.md §8). Copy to config.yaml
# (gitignored) and adjust. Each component reads only its own keys; camera `id`
# (its color) is its name everywhere and ties sections together.
#
# `${VAR}` is replaced from the environment (for docker compose: from
# secrets/streamhub.env); an unset variable is an error. Quote values that may
# contain YAML-special characters once expanded.

# Runtime state. Inside the container this is the mounted ./data/streamhub.
data_dir: /data

cameras:
  - id: grey
    rtsp: "rtsp://camera:${CAM_GREY_PASSWORD}@192.168.0.213:554/stream1"
    # Passed as-is to CV workers. rotate_deg: the model's input is rotated
    # clockwise by this (sideways-mounted camera); detect_roi: [x0, y0, x1, y1]
    # fractions of the frame to run detection on.
    cv: {rotate_deg: 90}
  - id: beige
    rtsp: "rtsp://camera:${CAM_BEIGE_PASSWORD}@192.168.0.214:554/stream1"
    cv: {rotate_deg: 90}
  - id: black
    rtsp: "rtsp://camera:${CAM_BLACK_PASSWORD}@192.168.0.215:554/stream1"
    cv: {rotate_deg: 90}

streamhub:
  listen: ":8090"
  # Built webui (the image has it here).
  webui_dir: /webui
  recordings:
    # Segments end at the first keyframe after this length.
    segment_target: 10s
    # Put CACHEDIR.TAG into the recordings dir so backup tools skip it.
    cachedir_tag: true
    # How often to rescan the recordings dir for files deleted by others.
    rescan: 1m
  # CV workers (and later the decider) connect here.
  hub_listen: ":9000"

pruner:
  # Never sparsify recordings newer than this.
  keep_recent: 3h
  # Older recordings are kept this far around any detection.
  event_margin: 30s
  # Delete old recordings CV never looked at (e.g. no worker was running).
  delete_unprocessed: true
  # Total size cap; the oldest (unpinned) recordings go first.
  max_size: 50GB
  interval: 10m
  dry_run: false

decider:
  # While the old feeder services still drive the feeders, keep this on: the
  # decider then decides and journals but never calls the feeder API.
  dry_run: true
  # Default: <data_dir>/feed_journal/journal.db (journal.dry-run.db while
  # dry_run, so pretend feeds never reach the real journal). When taking over
  # from the old feeder services, stop them and copy their journal
  # (data/feed_journal/journal.db + -wal) to data/streamhub/feed_journal/:
  # scheduled feeding checks it for slots already fed today — with an empty
  # journal it would feed the latest missed slots again.
  # journal_db: /data/feed_journal/journal.db
  feeders:
    - id: feeder1
      camera: grey
      api_base_url: https://feeder.khvoinitsky.org
      serial_number: AF06003100024B622027DC
      allowed_cats: [chuzh, ellie]
      # Previous detector setting (detector_unknown_conf): below this the top
      # identity counts as "unknown".
      unknown_conf: 0.5
      # Close the door once the cat has been out of view this long.
      door_close_timeout_sec: 10
      # A door session counts as a meal (journal stats only) when the cat was
      # seen at least this long.
      min_meal_sec: 15
      # Other tuning keeps the old feeder defaults:
      # presence_window_sec 5, classifier_min_conf 0.9,
      # open_debounce_sec 3, multi_debounce_sec 2, stream_blip_grace_sec 25,
      # action_polygon: whole frame. See decider/decider/config.py.
      # Opt-in short status code on the feeder display (see decider/display.py).
      status_display: false
      feed: {mode: none}
    - id: feeder2
      camera: beige
      api_base_url: https://feeder.khvoinitsky.org
      serial_number: AF06003100027DFB110L5V
      allowed_cats: [alisa]
      door_close_timeout_sec: 10
      min_meal_sec: 15
      unknown_conf: 0.8
      feed:
        mode: scheduled
        grain_num: 1
        times: ["07:00", "14:00", "18:00", "21:00", "02:00"]
        tz: America/Chicago
        catchup_max: 2
    - id: feeder3
      camera: black
      api_base_url: https://feeder.khvoinitsky.org
      serial_number: AF060103031EA0DA037F
      allowed_cats: [felisis, unknown]  # TEMP: felisis unrecognisable after haircut; remove once retrained
      door_close_timeout_sec: 10
      min_meal_sec: 15
      unknown_conf: 0.8
      feed:
        mode: scheduled
        grain_num: 1
        times: ["07:00", "14:00", "18:00", "21:00", "02:00"]
        tz: America/Chicago
        catchup_max: 2
