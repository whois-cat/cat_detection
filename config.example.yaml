# Shared config for the new stack (see PLAN.md §8). Copy to config.yaml
# (gitignored) and adjust. Each component reads only its own keys; camera `id`
# (its color) is its name everywhere and ties sections together.
#
# `${VAR}` is replaced from the environment (for docker compose: from
# secrets/streamhub.env); an unset variable is an error. Quote values that may
# contain YAML-special characters once expanded.

# Runtime state. Inside the container this is the mounted ./data/streamhub.
data_dir: /data

cameras:
  - id: grey
    rtsp: "rtsp://camera:${CAM_GREY_PASSWORD}@192.168.0.213:554/stream1"
    # Passed as-is to CV workers. rotate_deg: the model's input is rotated
    # clockwise by this (sideways-mounted camera); detect_roi: [x0, y0, x1, y1]
    # fractions of the frame to run detection on.
    cv: {rotate_deg: 90}
  - id: beige
    rtsp: "rtsp://camera:${CAM_BEIGE_PASSWORD}@192.168.0.214:554/stream1"
    cv: {rotate_deg: 90}
  - id: black
    rtsp: "rtsp://camera:${CAM_BLACK_PASSWORD}@192.168.0.215:554/stream1"
    cv: {rotate_deg: 90}

streamhub:
  listen: ":8090"
  # Built webui (the image has it here).
  webui_dir: /webui
  recordings:
    # Segments end at the first keyframe after this length.
    segment_target: 10s
    # Put CACHEDIR.TAG into the recordings dir so backup tools skip it.
    cachedir_tag: true
    # How often to rescan the recordings dir for files deleted by others.
    rescan: 1m
  # CV workers (and later the decider) connect here.
  hub_listen: ":9000"

pruner:
  # Never sparsify recordings newer than this.
  keep_recent: 3h
  # Older recordings are kept this far around any detection.
  event_margin: 30s
  # Delete old recordings CV never looked at (e.g. no worker was running).
  delete_unprocessed: true
  # Total size cap; the oldest (unpinned) recordings go first.
  max_size: 50GB
  interval: 10m
  dry_run: false
